<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050706"/>
      <stop offset="50%" stop-color="#080A09"/>
      <stop offset="100%" stop-color="#0F1812"/>
    </linearGradient>

    <filter id="techGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00C878" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>

    <style>
      .font-mono { font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .tech-badge { transition: all 0.2s ease; }
    </style>
  </defs>

  <rect width="950" height="480" rx="14" fill="url(#techBg)"/>
  <rect width="950" height="480" rx="14" fill="url(#techGrid)"/>
  <rect x="3" y="3" width="944" height="474" rx="12" fill="none" stroke="#00C878" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Section Header -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="12" height="18" fill="#00C878" rx="2" filter="url(#techGlow)"/>
    <text x="22" y="15" fill="#FFFFFF" font-size="18" font-weight="800" letter-spacing="1.5" class="font-sans">
      ARSENAL // VERIFIED TECHNOLOGY STACK
    </text>
    <text x="500" y="15" fill="#8B8B95" font-size="11" font-weight="600" letter-spacing="1" class="font-mono">
      AUTHENTIC SKILLS VERIFIED VIA PRODUCTION CODE
    </text>
    <line x1="0" y1="28" x2="890" y2="28" stroke="#00C878" stroke-width="0.8" stroke-opacity="0.3"/>
  </g>

  <!-- Row 1: Languages & Backend Frameworks -->
  <!-- Card 1: Languages -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="435" height="110" rx="8" fill="#121713" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="4" height="110" rx="2" fill="#00C878"/>
    <text x="18" y="24" fill="#00C878" font-size="11" font-weight="800" letter-spacing="1.5" class="font-mono">
      01 // PROGRAMMING LANGUAGES
    </text>
    
    <!-- Badges -->
    <g transform="translate(18, 42)">
      <!-- Java -->
      <rect x="0" y="0" width="90" height="28" rx="5" fill="#080A09" stroke="#00C878" stroke-width="1"/>
      <circle cx="12" cy="14" r="3.5" fill="#00C878"/>
      <text x="24" y="18" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">Java</text>

      <!-- SQL -->
      <rect x="100" y="0" width="80" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="140" y="18" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" class="font-mono">SQL</text>

      <!-- Shell Scripting -->
      <rect x="190" y="0" width="125" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="252" y="18" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle" class="font-mono">Shell Scripting</text>

      <!-- Python -->
      <rect x="325" y="0" width="85" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="367" y="18" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" class="font-mono">Python</text>
    </g>
    <text x="18" y="96" fill="#8B8B95" font-size="10" class="font-mono">Core focus: High concurrency Java &amp; optimized SQL querying</text>
  </g>

  <!-- Card 2: Backend & Frameworks -->
  <g transform="translate(485, 80)">
    <rect x="0" y="0" width="435" height="110" rx="8" fill="#121713" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="4" height="110" rx="2" fill="#39FF14"/>
    <text x="18" y="24" fill="#39FF14" font-size="11" font-weight="800" letter-spacing="1.5" class="font-mono">
      02 // BACKEND FRAMEWORKS &amp; APIs
    </text>
    
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="115" height="28" rx="5" fill="#080A09" stroke="#39FF14" stroke-width="1"/>
      <circle cx="12" cy="14" r="3.5" fill="#39FF14"/>
      <text x="24" y="18" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">Spring Boot</text>

      <rect x="125" y="0" width="125" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="187" y="18" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle" class="font-mono">Spring Data JPA</text>

      <rect x="260" y="0" width="85" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="302" y="18" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle" class="font-mono">REST APIs</text>

      <rect x="355" y="0" width="70" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="390" y="18" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">Security</text>
    </g>
    <text x="18" y="96" fill="#8B8B95" font-size="10" class="font-mono">Hibernate ORM • Spring Security • Inter-service communication</text>
  </g>

  <!-- Row 2: Databases/Caching & DevOps/Tools -->
  <!-- Card 3: Databases & Caching -->
  <g transform="translate(30, 205)">
    <rect x="0" y="0" width="435" height="110" rx="8" fill="#121713" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="4" height="110" rx="2" fill="#00E676"/>
    <text x="18" y="24" fill="#00E676" font-size="11" font-weight="800" letter-spacing="1.5" class="font-mono">
      03 // DATABASES &amp; DISTRIBUTED CACHING
    </text>
    
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="105" height="28" rx="5" fill="#080A09" stroke="#00E676" stroke-width="1"/>
      <circle cx="12" cy="14" r="3.5" fill="#00E676"/>
      <text x="24" y="18" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">PostgreSQL</text>

      <rect x="115" y="0" width="115" height="28" rx="5" fill="#080A09" stroke="#FF1744" stroke-width="1"/>
      <circle cx="127" cy="14" r="3.5" fill="#FF1744"/>
      <text x="139" y="18" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">Redis Cache</text>

      <rect x="240" y="0" width="80" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="280" y="18" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" class="font-mono">MySQL</text>

      <rect x="330" y="0" width="85" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="372" y="18" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle" class="font-mono">MongoDB</text>
    </g>
    <text x="18" y="96" fill="#8B8B95" font-size="10" class="font-mono">Atomic Ops (INCR, SET NX EX) • Indexing • Multi-tier caching</text>
  </g>

  <!-- Card 4: DevOps & Tools -->
  <g transform="translate(485, 205)">
    <rect x="0" y="0" width="435" height="110" rx="8" fill="#121713" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="4" height="110" rx="2" fill="#8B8B95"/>
    <text x="18" y="24" fill="#FFFFFF" font-size="11" font-weight="800" letter-spacing="1.5" class="font-mono">
      04 // DEVOPS &amp; ENGINEERING WORKFLOW
    </text>
    
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="85" height="28" rx="5" fill="#080A09" stroke="#00C878" stroke-width="0.8"/>
      <text x="42" y="18" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" class="font-mono">Docker</text>

      <rect x="95" y="0" width="130" height="28" rx="5" fill="#080A09" stroke="#00C878" stroke-width="1"/>
      <text x="160" y="18" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle" class="font-mono">Docker Compose</text>

      <rect x="235" y="0" width="75" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="272" y="18" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" class="font-mono">Maven</text>

      <rect x="320" y="0" width="55" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="347" y="18" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" class="font-mono">Git</text>

      <rect x="385" y="0" width="40" height="28" rx="5" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
      <text x="405" y="18" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">CI</text>
    </g>
    <text x="18" y="96" fill="#8B8B95" font-size="10" class="font-mono">Postman API Testing • Linux Environments • GitHub Workflows</text>
  </g>

  <!-- Row 3: Full Width Core Architecture Concepts -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="890" height="120" rx="8" fill="#121713" stroke="#00C878" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#00C878" filter="url(#techGlow)"/>
    <text x="22" y="24" fill="#00C878" font-size="11.5" font-weight="800" letter-spacing="1.5" class="font-mono">
      05 // ARCHITECTURE, CONCURRENCY &amp; DISTRIBUTED PATTERNS
    </text>

    <g transform="translate(22, 44)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="26" rx="13" fill="#080A09" stroke="#00C878" stroke-width="0.8"/>
      <text x="82" y="17" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Microservices Arch</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="170" height="26" rx="13" fill="#080A09" stroke="#39FF14" stroke-width="0.8"/>
      <text x="260" y="17" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Thread-Safe Concurrency</text>

      <!-- Pill 3 -->
      <rect x="355" y="0" width="185" height="26" rx="13" fill="#080A09" stroke="#FF1744" stroke-width="0.8"/>
      <text x="447" y="17" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Distributed Rate Limiting</text>

      <!-- Pill 4 -->
      <rect x="550" y="0" width="165" height="26" rx="13" fill="#080A09" stroke="#00E676" stroke-width="0.8"/>
      <text x="632" y="17" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Fault Isolation</text>

      <!-- Pill 5 -->
      <rect x="725" y="0" width="140" height="26" rx="13" fill="#080A09" stroke="#8B8B95" stroke-width="0.8"/>
      <text x="795" y="17" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Eureka Discovery</text>

      <!-- Line 2 Pills -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="185" height="26" rx="13" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
        <text x="92" y="17" fill="#8B8B95" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Atomic Ops (INCR/SET NX)</text>

        <rect x="195" y="0" width="195" height="26" rx="13" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
        <text x="292" y="17" fill="#8B8B95" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Database Schema Design</text>

        <rect x="400" y="0" width="220" height="26" rx="13" fill="#080A09" stroke="#8B8B95" stroke-width="0.75"/>
        <text x="510" y="17" fill="#8B8B95" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Scheduled Batch CRON Digests</text>

        <rect x="630" y="0" width="235" height="26" rx="13" fill="#080A09" stroke="#00C878" stroke-width="0.75"/>
        <text x="747" y="17" fill="#00C878" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">Data Structures &amp; Algorithms</text>
      </g>
    </g>
  </g>
</svg>