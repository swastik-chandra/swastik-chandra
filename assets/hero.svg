<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050706"/>
      <stop offset="50%" stop-color="#080A09"/>
      <stop offset="100%" stop-color="#0E1611"/>
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C878"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00C878" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00C878" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1.5" fill="#00C878" fill-opacity="0.2"/>
    </pattern>

    <style>
      @keyframes slashPulse {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.9; stroke-dashoffset: 80; }
      }
      @keyframes floatAura {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
        50% { transform: translateY(-8px) scale(1.03); opacity: 0.95; }
      }
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #00C878); }
      }
      @keyframes blinkCursor {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .font-mono { font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .aura-glow { animation: floatAura 6s ease-in-out infinite; transform-origin: center; }
      .slash-line { animation: slashPulse 4s ease-in-out infinite; stroke-dasharray: 40 10; }
      .card-border { animation: borderGlow 3s ease-in-out infinite; }
      .cursor { animation: blinkCursor 1s infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="950" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="950" height="340" rx="16" fill="url(#gridPattern)"/>

  <!-- Outer Neon Border with HUD Corners -->
  <rect x="4" y="4" width="942" height="332" rx="14" fill="none" stroke="#00C878" stroke-width="1.5" class="card-border"/>
  
  <!-- Corner Tech Accents -->
  <path d="M 4 35 L 4 4 L 35 4" fill="none" stroke="#00C878" stroke-width="3" filter="url(#softGlow)"/>
  <path d="M 915 4 L 946 4 L 946 35" fill="none" stroke="#00C878" stroke-width="3" filter="url(#softGlow)"/>
  <path d="M 946 305 L 946 336 L 915 336" fill="none" stroke="#00C878" stroke-width="3" filter="url(#softGlow)"/>
  <path d="M 35 336 L 4 336 L 4 305" fill="none" stroke="#00C878" stroke-width="3" filter="url(#softGlow)"/>

  <!-- Zoro Three-Sword Slashes Visual Composition (Background) -->
  <g opacity="0.35" class="aura-glow">
    <!-- Sword 1: Enma Emerald Slash -->
    <path d="M 500 -20 L 980 280" stroke="url(#slashGrad)" stroke-width="3.5" class="slash-line" filter="url(#emeraldGlow)"/>
    <path d="M 520 -20 L 990 270" stroke="#00C878" stroke-width="1" opacity="0.5"/>
    
    <!-- Sword 2: Wado Ichimonji White/Silver Flash -->
    <path d="M 450 360 L 900 60" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-dasharray="80 30"/>
    
    <!-- Sword 3: Sandai Kitetsu Neon Red Demonic Edge -->
    <path d="M 680 -10 L 970 200" stroke="#FF1744" stroke-width="2" opacity="0.6" filter="url(#softGlow)"/>

    <!-- Subtle Aura Flames -->
    <ellipse cx="780" cy="180" rx="160" ry="90" fill="#00C878" opacity="0.12" filter="url(#emeraldGlow)"/>
    <circle cx="780" cy="170" r="110" fill="#00E676" opacity="0.08" filter="url(#emeraldGlow)"/>
  </g>

  <!-- Status Bar / Telemetry Header -->
  <g transform="translate(35, 32)">
    <circle cx="6" cy="6" r="4" fill="#00C878" filter="url(#softGlow)"/>
    <circle cx="6" cy="6" r="8" fill="none" stroke="#00C878" stroke-width="1" opacity="0.4"/>
    <text x="24" y="10" fill="#00C878" font-size="11" font-weight="700" letter-spacing="2" class="font-mono">STATUS: SYSTEMS ONLINE // KING OF HELL MODE</text>

    <rect x="420" y="-3" width="180" height="20" rx="10" fill="#121713" stroke="#00C878" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="510" y="11" fill="#8B8B95" font-size="9.5" text-anchor="middle" font-weight="600" class="font-mono">ARCH: DISTRIBUTED / REDIS</text>

    <rect x="620" y="-3" width="160" height="20" rx="10" fill="#121713" stroke="#FF1744" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="700" y="11" fill="#FF1744" font-size="9.5" text-anchor="middle" font-weight="700" class="font-mono">SANTORYU ENGINE v2.6</text>
  </g>

  <!-- Three Swords Crest Iconography (Top Right) -->
  <g transform="translate(850, 36)" opacity="0.9">
    <circle cx="20" cy="20" r="24" fill="#121713" stroke="#00C878" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="20" y1="4" x2="20" y2="36" stroke="#FFFFFF" stroke-width="2.2"/>
    <circle cx="20" cy="13" r="3" fill="#00C878"/>
    <line x1="8" y1="8" x2="32" y2="32" stroke="#00C878" stroke-width="1.8"/>
    <line x1="32" y1="8" x2="8" y2="32" stroke="#FF1744" stroke-width="1.8"/>
  </g>

  <!-- Main Hero Identity -->
  <g transform="translate(35, 96)">
    <text x="2" y="0" fill="#8B8B95" font-size="12" font-weight="700" letter-spacing="3" class="font-mono">RORONOA ZORO // SAN-KEN-RYU BACKEND</text>

    <text x="0" y="46" fill="#FFFFFF" font-size="42" font-weight="900" letter-spacing="1" class="font-sans" filter="url(#softGlow)">
      SWASTIK CHANDRA
    </text>
    <text x="480" y="46" fill="#00C878" font-size="42" font-weight="900" letter-spacing="1" class="font-sans" filter="url(#emeraldGlow)">
      AGRAHARI
    </text>

    <!-- Professional Role Title Badge -->
    <g transform="translate(2, 78)">
      <rect x="0" y="-18" width="430" height="32" rx="6" fill="#121713" stroke="#00C878" stroke-width="1.2" stroke-opacity="0.8"/>
      <path d="M 0 -18 L 10 -18 L 0 -8 Z" fill="#00C878"/>
      <text x="16" y="3" fill="#00C878" font-size="14" font-weight="800" letter-spacing="1.5" class="font-mono">
        JAVA BACKEND DEVELOPER
      </text>
      <text x="286" y="3" fill="#FFFFFF" font-size="12" font-weight="600" letter-spacing="1" class="font-mono">
        | DISTRIBUTED SYS
      </text>
    </g>

    <!-- Tagline Quote -->
    <g transform="translate(4, 130)">
      <text x="0" y="0" fill="#00C878" font-size="20" font-weight="900">“</text>
      <text x="16" y="-3" fill="#D0D7DE" font-size="15" font-weight="500" font-style="italic" class="font-sans">
        Discipline. Consistency. Code. Building powerful backend systems.
      </text>
      <text x="546" y="0" fill="#00C878" font-size="20" font-weight="900">”</text>
    </g>
  </g>

  <!-- Bottom Dashboard Specs Bar -->
  <g transform="translate(35, 288)">
    <rect x="0" y="0" width="195" height="32" rx="6" fill="#121713" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.5"/>
    <text x="12" y="20" fill="#8B8B95" font-size="10" font-weight="600" class="font-mono">ENGINE:</text>
    <text x="70" y="20" fill="#00C878" font-size="11.5" font-weight="700" class="font-mono">Spring Boot 3.x</text>

    <rect x="210" y="0" width="195" height="32" rx="6" fill="#121713" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.5"/>
    <text x="222" y="20" fill="#8B8B95" font-size="10" font-weight="600" class="font-mono">CACHING:</text>
    <text x="286" y="20" fill="#39FF14" font-size="11.5" font-weight="700" class="font-mono">Redis Atomic Ops</text>

    <rect x="420" y="0" width="195" height="32" rx="6" fill="#121713" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.5"/>
    <text x="432" y="20" fill="#8B8B95" font-size="10" font-weight="600" class="font-mono">DATABASE:</text>
    <text x="506" y="20" fill="#00E676" font-size="11.5" font-weight="700" class="font-mono">PostgreSQL</text>

    <rect x="630" y="0" width="195" height="32" rx="6" fill="#121713" stroke="#00C878" stroke-width="0.75" stroke-opacity="0.5"/>
    <text x="642" y="20" fill="#8B8B95" font-size="10" font-weight="600" class="font-mono">DEVOPS:</text>
    <text x="706" y="20" fill="#FFFFFF" font-size="11.5" font-weight="700" class="font-mono">Docker Compose</text>

    <rect x="840" y="0" width="40" height="32" rx="6" fill="#121713" stroke="#FF1744" stroke-width="1"/>
    <text x="860" y="21" fill="#FF1744" font-size="14" text-anchor="middle" font-weight="900">⚔️</text>
  </g>
</svg>