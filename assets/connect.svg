<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 210" width="100%" height="100%">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050706"/>
      <stop offset="60%" stop-color="#080A09"/>
      <stop offset="100%" stop-color="#101912"/>
    </linearGradient>

    <filter id="connGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-mono { font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="950" height="210" rx="14" fill="url(#connBg)"/>
  <rect x="3" y="3" width="944" height="204" rx="12" fill="none" stroke="#00C878" stroke-width="1.2" stroke-opacity="0.6"/>

  <g transform="translate(35, 32)">
    <rect x="0" y="0" width="12" height="18" fill="#00C878" rx="2" filter="url(#connGlow)"/>
    <text x="22" y="15" fill="#FFFFFF" font-size="18" font-weight="800" letter-spacing="1.5" class="font-sans">
      TRANSMISSION CHANNELS // JOIN THE STRAW HAT CREW
    </text>
    <text x="610" y="15" fill="#00C878" font-size="11.5" font-weight="700" letter-spacing="1.5" class="font-mono">
      [ OPEN TO BACKEND ROLES ]
    </text>
    <line x1="0" y1="28" x2="880" y2="28" stroke="#00C878" stroke-width="0.8" stroke-opacity="0.3"/>
  </g>

  <!-- Channels List -->
  <g transform="translate(35, 85)">
    <!-- Email -->
    <rect x="0" y="0" width="280" height="95" rx="8" fill="#121713" stroke="#00C878" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="20" y="26" fill="#00C878" font-size="11" font-weight="800" letter-spacing="1" class="font-mono">PRIMARY TRANSMISSION</text>
    <text x="20" y="52" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">chandraswayam5@gmail.com</text>
    <text x="20" y="74" fill="#8B8B95" font-size="10.5" class="font-mono">Response latency &lt; 24h</text>

    <!-- LinkedIn -->
    <rect x="300" y="0" width="280" height="95" rx="8" fill="#121713" stroke="#00C878" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="320" y="26" fill="#00E676" font-size="11" font-weight="800" letter-spacing="1" class="font-mono">PROFESSIONAL NETWORK</text>
    <text x="320" y="52" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">linkedin.com/in/swastik-chandra</text>
    <text x="320" y="74" fill="#8B8B95" font-size="10.5" class="font-mono">Backend Engineering &amp; Tech Updates</text>

    <!-- GitHub / Location -->
    <rect x="600" y="0" width="280" height="95" rx="8" fill="#121713" stroke="#00C878" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="620" y="26" fill="#39FF14" font-size="11" font-weight="800" letter-spacing="1" class="font-mono">BASE LOCATION &amp; GITHUB</text>
    <text x="620" y="52" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">swastik-chandra // UP, India</text>
    <text x="620" y="74" fill="#8B8B95" font-size="10.5" class="font-mono">Available for On-site / Remote</text>
  </g>
</svg>